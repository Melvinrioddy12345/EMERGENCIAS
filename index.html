<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Red de Emergencia Offline</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%9F%3C/text%3E%3C/svg%3E" />

<link rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="" />

<style>
/* ============================================================
   Estilos — versión simplificada
   ============================================================ */
:root {
  --bg:        #0f172a;
  --bg-soft:   #1e293b;
  --panel:     #1a2332;
  --border:    #334155;
  --text:      #e2e8f0;
  --text-dim:  #94a3b8;
  --accent:    #38bdf8;
  --crit:      #ef4444;
  --high:      #f97316;
  --moderate:  #64748b;
  --ok:        #22c55e;
  --radius:    12px;
  --dock-h:    64px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.45; min-height: 100%;
}

/* --------- Header --------- */
.app-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: .7rem 1rem;
  background: linear-gradient(180deg, #111c33 0%, #0f172a 100%);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.brand { display: flex; align-items: center; gap: .6rem; }
.brand-icon { font-size: 1.5rem; }
.brand h1 { font-size: 1rem; margin: 0; }
.conn-status {
  display: flex; align-items: center; gap: .4rem;
  font-size: .75rem; color: var(--text-dim);
  background: var(--bg-soft); padding: .3rem .65rem;
  border-radius: 999px; border: 1px solid var(--border);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--moderate); }
.dot--on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }

/* --------- Main --------- */
.main {
  padding: 1rem 1rem calc(var(--dock-h) + 1.5rem);
  max-width: 900px; margin: 0 auto;
}
.view { display: none; animation: fade .2s ease; }
.view.is-active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* --------- Sub-pestañas (iconos) --------- */
.subtabs {
  display: flex; justify-content: center; gap: .5rem;
  margin-bottom: 1.2rem;
}
.subtab {
  width: 46px; height: 46px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: 50%;
  font-size: 1.2rem; cursor: pointer; font-family: inherit;
  transition: background .15s, color .15s, border-color .15s, transform .05s;
}
.subtab:hover { background: var(--bg-soft); color: var(--text); }
.subtab.is-on { background: var(--accent); color: #06121f; border-color: var(--accent); }
.subtab:active { transform: scale(.95); }

/* --------- Sub-vistas --------- */
.subview { display: none; }
.subview.is-active { display: block; }

/* ============================================================
   BOTONES DE PALABRAS CLAVE (chips de emergencia)
   ============================================================ */
.keywords {
  display: grid; gap: .7rem;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  margin-top: .5rem;
}
.kw {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .35rem; min-height: 100px; padding: .8rem .6rem;
  border-radius: var(--radius); cursor: pointer;
  border: 2px solid transparent;
  font-family: inherit; font-weight: 700; font-size: .9rem;
  color: #fff; text-align: center;
  transition: transform .06s, filter .15s, box-shadow .15s;
  box-shadow: 0 3px 10px rgba(0,0,0,.35);
}
.kw:hover { filter: brightness(1.08); }
.kw:active { transform: scale(.97); }
.kw-ico { font-size: 1.7rem; }

/* Colores por tipo / prioridad de emergencia */
.kw[data-prio="CRITICO"]  { background: linear-gradient(160deg, #b91c1c, #7f1d1d); }
.kw[data-prio="ALTO"]     { background: linear-gradient(160deg, #ea580c, #9a3412); }
.kw[data-prio="MODERADO"] { background: linear-gradient(160deg, #475569, #334155); }

/* --------- Feedback tras pulsar --------- */
.kw-feedback {
  margin-top: 1rem; padding: .8rem 1rem;
  background: var(--bg-soft); border: 1px dashed var(--border);
  border-radius: var(--radius); font-size: .9rem; color: var(--text-dim);
  text-align: center;
}
.kw-feedback strong { color: var(--text); }

/* --------- Estadísticas (Resumen) --------- */
.stats-grid {
  display: grid; gap: .7rem;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  margin-bottom: 1rem;
}
.stat {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: .8rem;
  display: flex; flex-direction: column; gap: .15rem;
}
.stat--crit { border-color: var(--crit); }
.stat-ico { font-size: 1.1rem; }
.stat-value { font-size: 1.4rem; font-weight: 700; }
.stat-label { font-size: .72rem; color: var(--text-dim); }

/* --------- Botones fantasma genéricos --------- */
.btn-ghost {
  display: inline-flex; align-items: center; gap: .4rem;
  background: transparent; color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: .55rem .9rem; font-size: .85rem; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.btn-ghost:hover { background: var(--bg-soft); }

/* --------- Listas --------- */
.report-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .6rem; }
.report-item {
  background: var(--panel); border: 1px solid var(--border);
  border-left-width: 5px; border-radius: var(--radius);
  padding: .75rem .9rem; display: flex; flex-direction: column; gap: .3rem;
}
.report-item[data-prio="CRITICO"]  { border-left-color: var(--crit); }
.report-item[data-prio="ALTO"]     { border-left-color: var(--high); }
.report-item[data-prio="MODERADO"] { border-left-color: var(--moderate); }
.report-head { display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; align-items: center; }
.report-type { font-weight: 700; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.report-meta { font-size: .72rem; color: var(--text-dim); }
.report-content { font-size: .9rem; word-break: break-word; }
.badge {
  display: inline-block; font-size: .68rem; font-weight: 700;
  padding: .12rem .45rem; border-radius: 999px;
  background: var(--bg-soft); color: var(--text-dim); border: 1px solid var(--border);
}
.badge--demo { background: #1e3a8a; color: #cfe3ff; border-color: #1e40af; }
.icon-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 8px;
  width: 32px; height: 32px; cursor: pointer; font-size: .95rem;
}
.icon-btn:hover { background: var(--bg-soft); color: var(--text); }

/* --------- Filtros minimalistas --------- */
.filters {
  display: grid; grid-template-columns: 2fr 1fr 1fr;
  gap: .5rem; margin-bottom: 1rem;
}
@media (max-width: 620px) { .filters { grid-template-columns: 1fr; } }
input, select, textarea {
  background: var(--bg-soft); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: .6rem .7rem; font-family: inherit; font-size: .9rem; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

/* --------- Mapa --------- */
.map { width: 100%; height: 460px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-soft); }

/* --------- Toasts --------- */
.toast {
  position: fixed; bottom: calc(var(--dock-h) + 20px); left: 50%; transform: translateX(-50%);
  background: var(--bg-soft); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: .65rem 1rem; font-size: .88rem; box-shadow: 0 4px 14px rgba(0,0,0,.4);
  z-index: 999; max-width: 90vw;
}
.toast--ok  { border-color: var(--ok); }
.toast--err { border-color: var(--crit); }

/* --------- Dialog --------- */
.dialog {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel); color: var(--text); padding: 1.1rem;
  max-width: 420px; width: 92vw;
}
.dialog h3 { margin: 0 0 .5rem; }
.dialog menu { display: flex; gap: .5rem; justify-content: flex-end; padding: 0; margin: 1rem 0 0; }
.dialog button {
  padding: .55rem .9rem; border-radius: 8px; font-weight: 600;
  border: 1px solid var(--border); background: transparent; color: var(--text);
  cursor: pointer; font-family: inherit;
}
.dialog button[value="ok"] { background: var(--crit); border-color: var(--crit); color: #fff; }

/* ============================================================
   DOCK INFERIOR — botones fantasma, solo iconos, sin texto
   ============================================================ */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; height: var(--dock-h);
  display: flex; justify-content: center; align-items: center; gap: 1.2rem;
  padding: 0 .8rem;
  background: transparent;
  pointer-events: none;      /* deja pasar clics fuera de los botones */
  z-index: 300;
}
.dock-btn {
  pointer-events: auto;       /* los botones sí reciben clics */
  width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(15, 23, 42, .35);   /* fantasma: casi transparente */
  border: 1px solid rgba(148, 163, 184, .35);
  border-radius: 50%;
  color: var(--text);
  font-size: 1.5rem;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: background .15s, border-color .15s, transform .05s, box-shadow .15s;
  box-shadow: 0 3px 12px rgba(0,0,0,.25);
}
.dock-btn:hover { background: rgba(30, 41, 59, .55); }
.dock-btn:active { transform: scale(.94); }
.dock-btn.is-active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(56, 189, 248, .12);
  box-shadow: 0 0 14px rgba(56, 189, 248, .35);
}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">🛟</span>
    <h1>Red de Emergencia</h1>
  </div>
  <div class="conn-status" role="status" aria-live="polite">
    <span class="dot dot--off" id="connDot"></span>
    <span id="connText">Sin red</span>
  </div>
</header>

<main class="main">

  <!-- ============================================================
       MÓDULO 1 — REPORTE Y ALERTA
       ============================================================ -->
  <section class="view is-active" id="view-report">

    <!-- Sub-pestañas solo con iconos -->
    <nav class="subtabs" aria-label="Secciones">
      <button class="subtab is-on" data-sub="new"     title="Nueva alerta">🚨</button>
      <button class="subtab"       data-sub="list"    title="Reportes">📋</button>
      <button class="subtab"       data-sub="summary" title="Resumen">📊</button>
    </nav>

    <!-- ---------- Nueva alerta: solo palabras clave ---------- -->
    <div class="subview is-active" id="sub-new">
      <div class="keywords" id="keywordGrid"></div>
      <div class="kw-feedback" id="kwFeedback">
        Pulsa un botón para emitir la alerta. El color indica la gravedad.
      </div>
    </div>

    <!-- ---------- Reportes ---------- -->
    <div class="subview" id="sub-list">
      <div class="filters">
        <input type="search" id="filterText" placeholder="🔎 Buscar…" />
        <select id="filterPriority">
          <option value="">Prioridad (todas)</option>
          <option value="CRITICO">🔴 Crítico</option>
          <option value="ALTO">🟠 Alto</option>
          <option value="MODERADO">⚪ Moderado</option>
        </select>
        <select id="sortBy">
          <option value="priority">↕ Prioridad</option>
          <option value="date">🕒 Recientes</option>
          <option value="type">🔤 Tipo</option>
        </select>
      </div>
      <ul class="report-list" id="allReports"></ul>
    </div>

    <!-- ---------- Resumen ---------- -->
    <div class="subview" id="sub-summary">
      <div class="stats-grid">
        <article class="stat"><span class="stat-ico">📶</span><span class="stat-value" id="statConn">—</span><span class="stat-label">Comunicación</span></article>
        <article class="stat"><span class="stat-ico">💾</span><span class="stat-value" id="statStored">0</span><span class="stat-label">Almacenados</span></article>
        <article class="stat stat--crit"><span class="stat-ico">🚨</span><span class="stat-value" id="statCritical">0</span><span class="stat-label">Críticos</span></article>
        <article class="stat"><span class="stat-ico">📥</span><span class="stat-value" id="statReceived">0</span><span class="stat-label">Recibidos</span></article>
        <article class="stat"><span class="stat-ico">📱</span><span class="stat-value" id="statPeers">0</span><span class="stat-label">Dispositivos</span></article>
        <article class="stat"><span class="stat-ico">⏳</span><span class="stat-value" id="statPending">0</span><span class="stat-label">Pendientes</span></article>
      </div>

      <div style="display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem;">
        <button class="btn-ghost" id="btnLoadDemo">🧪 Datos demo</button>
        <button class="btn-ghost" id="btnExport">⬇ JSON</button>
      </div>

      <ul class="report-list" id="recentReports"></ul>
    </div>

  </section>

  <!-- ============================================================
       MÓDULO 2 — MAPAS
       ============================================================ -->
  <section class="view" id="view-map">
    <div id="map" class="map" aria-label="Mapa"></div>
    <p style="font-size:.78rem;color:var(--text-dim);margin-top:.6rem;" id="mapFallback" hidden>
      ⚠️ Mapa no disponible (sin conexión). Se muestra la lista.
    </p>
    <ul class="report-list" id="mapList" style="margin-top:.8rem;"></ul>
  </section>

</main>

<!-- ============================================================
     DOCK INFERIOR — solo iconos, transparente
     ============================================================ -->
<nav class="dock" aria-label="Módulos">
  <button class="dock-btn is-active" id="dockReport" title="Reporte y Alerta" aria-label="Reporte y Alerta">📋</button>
  <button class="dock-btn"           id="dockMap"    title="Mapas"             aria-label="Mapas">🗺️</button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<dialog id="confirmDialog" class="dialog">
  <form method="dialog">
    <h3 id="dlgTitle">Confirmar</h3>
    <p id="dlgMsg"></p>
    <menu>
      <button value="cancel">Cancelar</button>
      <button value="ok">Confirmar</button>
    </menu>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<script>
/* ============================================================
   Red de Emergencia Offline — versión simplificada
   ============================================================ */

/* --------- Utilidades --------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => (crypto.randomUUID && crypto.randomUUID()) ||
  'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
const fmtDate = (iso) => { try { return new Date(iso).toLocaleString(); } catch { return iso; } };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

/* ============================================================
   Palabras clave — cada botón ES la alerta
   ============================================================ */
const KEYWORDS = [
  { id: 'herido',       label: 'Herido',        icon: '🩸', prio: 'ALTO',     content: 'Persona herida' },
  { id: 'atrapado',     label: 'Atrapado',      icon: '⛓️', prio: 'CRITICO',  content: 'Persona atrapada' },
  { id: 'ayuda',        label: 'Ayuda urgente', icon: '🆘', prio: 'CRITICO',  content: 'Necesito ayuda urgente' },
  { id: 'desaparecido', label: 'Desaparecido',  icon: '🔍', prio: 'ALTO',     content: 'Persona desaparecida' },
  { id: 'zona',         label: 'Zona peligrosa',icon: '⚠️', prio: 'ALTO',     content: 'Zona peligrosa' },
  { id: 'ruta',         label: 'Ruta bloqueada',icon: '🚧', prio: 'MODERADO', content: 'Ruta bloqueada' },
  { id: 'agua',         label: 'Falta agua',    icon: '💧', prio: 'MODERADO', content: 'Falta de agua' },
  { id: 'alimentos',    label: 'Falta comida',  icon: '🍞', prio: 'MODERADO', content: 'Falta de alimentos' },
  { id: 'evacuacion',   label: 'Evacuación',    icon: '🚪', prio: 'CRITICO',  content: 'Solicitud de evacuación' },
  { id: 'incendio',     label: 'Incendio',      icon: '🔥', prio: 'CRITICO',  content: 'Incendio' },
  { id: 'inundacion',   label: 'Inundación',    icon: '🌊', prio: 'ALTO',     content: 'Inundación' },
  { id: 'derrumbe',     label: 'Derrumbe',      icon: '🪨', prio: 'CRITICO',  content: 'Derrumbe' },
];

const PRIO_LABEL = { CRITICO: '🔴 CRÍTICO', ALTO: '🟠 ALTO', MODERADO: '⚪ MODERADO' };

/* ============================================================
   Store — IndexedDB
   ============================================================ */
const Store = (() => {
  const DB_NAME = 'emergency-offline', DB_VERSION = 1;
  let dbPromise = null;
  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('messages')) {
          const s = db.createObjectStore('messages', { keyPath: 'messageId' });
          s.createIndex('priority', 'priority');
          s.createIndex('createdAt', 'createdAt');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  async function st(name, mode = 'readonly') {
    const db = await open();
    return db.transaction(name, mode).objectStore(name);
  }
  return {
    async putMessage(m) { const s = await st('messages','readwrite');
      return new Promise((r,j)=>{const q=s.put(m);q.onsuccess=()=>r(m);q.onerror=()=>j(q.error);}); },
    async getMessage(id) { const s = await st('messages');
      return new Promise((r,j)=>{const q=s.get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>j(q.error);}); },
    async allMessages() { const s = await st('messages');
      return new Promise((r,j)=>{const q=s.getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>j(q.error);}); },
    async deleteMessage(id) { const s = await st('messages','readwrite');
      return new Promise((r,j)=>{const q=s.delete(id);q.onsuccess=()=>r(true);q.onerror=()=>j(q.error);}); },
  };
})();

/* ============================================================
   Messages
   ============================================================ */
const Messages = (() => {
  const MAX_HOPS = 5;
  const DEFAULT_TTL_MS = 1000 * 60 * 60 * 24;

  function make({ type, content, priority, latitude, longitude, locationText, isDemo = false }) {
    const now = new Date();
    return {
      messageId: uid(),
      originId: getOriginId(),
      createdAt: now.toISOString(),
      priority,
      messageType: type,
      content: String(content || '').slice(0, 200),
      latitude:  typeof latitude  === 'number' ? latitude  : null,
      longitude: typeof longitude === 'number' ? longitude : null,
      locationText: locationText ? String(locationText).slice(0, 80) : null,
      hopCount: 0,
      expiresAt: new Date(now.getTime() + DEFAULT_TTL_MS).toISOString(),
      deliveryStatus: 'stored',
      isDemo,
      receivedFrom: null,
    };
  }
  async function save(msg) {
    const existing = await Store.getMessage(msg.messageId);
    if (existing) return { duplicate: true, message: existing };
    await Store.putMessage(msg);
    return { duplicate: false, message: msg };
  }
  async function markExpired() {
    const all = await Store.allMessages();
    const now = Date.now();
    for (const m of all) {
      if (m.deliveryStatus !== 'expired' && Date.parse(m.expiresAt) < now) {
        m.deliveryStatus = 'expired';
        await Store.putMessage(m);
      }
    }
  }
  return { make, save, markExpired, MAX_HOPS };
})();

function getOriginId() {
  let id = localStorage.getItem('eo-origin');
  if (!id) { id = 'peer-' + Math.random().toString(36).slice(2, 8); localStorage.setItem('eo-origin', id); }
  return id;
}

/* ============================================================
   Priority
   ============================================================ */
const Priority = (() => {
  const rank = { CRITICO: 0, ALTO: 1, MODERADO: 2 };
  function sort(list, by = 'priority') {
    const a = [...list];
    if (by === 'date') return a.sort((x,y)=>Date.parse(y.createdAt)-Date.parse(x.createdAt));
    if (by === 'type') return a.sort((x,y)=>x.messageType.localeCompare(y.messageType));
    return a.sort((x,y)=>{
      const d = rank[x.priority]-rank[y.priority];
      return d !== 0 ? d : Date.parse(y.createdAt)-Date.parse(x.createdAt);
    });
  }
  return { sort };
})();

/* ============================================================
   Location + CommAdapter (stubs honestos)
   ============================================================ */
const Location = {
  requestGPS: () => new Promise((res, rej) => {
    if (!('geolocation' in navigator)) return rej(new Error('sin geolocalización'));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      rej, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  })
};
const CommAdapter = {
  status: () => ({
    available: false,
    peers: [],
    reason: 'El navegador no expone Bluetooth mesh / Wi-Fi Direct.',
  })
};

/* ============================================================
   UI
   ============================================================ */
const UI = (() => {
  let t = null;
  function toast(msg, kind = '') {
    const el = $('#toast');
    el.textContent = msg;
    el.className = 'toast ' + (kind ? 'toast--' + kind : '');
    el.hidden = false;
    clearTimeout(t); t = setTimeout(() => { el.hidden = true; }, 2800);
  }
  function confirm(msg, title = 'Confirmar') {
    return new Promise(resolve => {
      const dlg = $('#confirmDialog');
      $('#dlgTitle').textContent = title;
      $('#dlgMsg').textContent = msg;
      const onClose = () => { dlg.removeEventListener('close', onClose); resolve(dlg.returnValue === 'ok'); };
      dlg.addEventListener('close', onClose);
      dlg.returnValue = 'cancel';
      dlg.showModal();
    });
  }
  return { toast, confirm };
})();

/* ============================================================
   Navegación
   ============================================================ */
function switchModule(name) {
  $$('.view').forEach(v => v.classList.toggle('is-active', v.id === 'view-' + name));
  $('#dockReport').classList.toggle('is-active', name === 'report');
  $('#dockMap').classList.toggle('is-active', name === 'map');
  if (name === 'map') setTimeout(initMap, 60);
  if (name === 'report') renderAllReports();
}
function switchSub(name) {
  $$('.subview').forEach(v => v.classList.toggle('is-active', v.id === 'sub-' + name));
  $$('.subtab').forEach(t => t.classList.toggle('is-on', t.dataset.sub === name));
  if (name === 'list') renderAllReports();
  if (name === 'summary') renderSummary();
}

/* ============================================================
   Render — Grid de palabras clave
   ============================================================ */
function renderKeywords() {
  const grid = $('#keywordGrid');
  grid.innerHTML = '';
  KEYWORDS.forEach(k => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'kw';
    b.dataset.prio = k.prio;
    b.dataset.id = k.id;
    b.innerHTML = `<span class="kw-ico">${k.icon}</span><span>${esc(k.label)}</span>`;
    b.addEventListener('click', () => emitFromKeyword(k));
    grid.appendChild(b);
  });
}

/* ============================================================
   Emitir alerta desde una palabra clave
   ============================================================ */
async function emitFromKeyword(k) {
  if (k.prio === 'CRITICO') {
    const ok = await UI.confirm(`Vas a emitir una alerta CRÍTICA: “${k.label}”. ¿Confirmas?`, 'Alerta crítica');
    if (!ok) return;
  }

  // Intentar GPS silenciosamente (no bloquea si falla o se rechaza)
  let geo = { lat: null, lng: null };
  try { geo = await Location.requestGPS(); } catch { /* sin GPS, seguimos */ }

  const msg = Messages.make({
    type: k.id,
    content: k.content,
    priority: k.prio,
    latitude: geo.lat,
    longitude: geo.lng,
    locationText: null,
  });

  try {
    await Messages.save(msg);
    const gpsTxt = geo.lat != null ? ' · 📍 GPS incluido' : '';
    UI.toast(`Alerta emitida: ${k.label}${gpsTxt}`, 'ok');
    const fb = $('#kwFeedback');
    fb.innerHTML =
      `✅ Registrado: <strong>${esc(k.label)}</strong> — ${PRIO_LABEL[k.prio]}` +
      (geo.lat != null ? ` · 📍 ${geo.lat.toFixed(4)}, ${geo.lng.toFixed(4)}` : ' · sin GPS');
    renderSummary();
    renderAllReports();
  } catch (err) {
    UI.toast('Error al guardar: ' + err.message, 'err');
  }
}

/* ============================================================
   Render — Resumen
   ============================================================ */
async function renderSummary() {
  await Messages.markExpired();
  const all = await Store.allMessages();
  const pending  = all.filter(m => m.deliveryStatus === 'stored' || m.deliveryStatus === 'pending');
  const critical = all.filter(m => m.priority === 'CRITICO' && m.deliveryStatus !== 'expired');
  const received = all.filter(m => !!m.receivedFrom);

  $('#statConn').textContent     = CommAdapter.status().available ? 'Activo' : 'Sin red';
  $('#statStored').textContent   = all.length;
  $('#statCritical').textContent = critical.length;
  $('#statReceived').textContent = received.length;
  $('#statPeers').textContent    = CommAdapter.status().peers.length;
  $('#statPending').textContent  = pending.length;

  const recent = Priority.sort(all, 'date').slice(0, 6);
  const ul = $('#recentReports');
  ul.innerHTML = recent.length ? '' : '<li class="report-item">Sin reportes todavía.</li>';
  recent.forEach(m => ul.appendChild(renderReportItem(m)));
}

/* ============================================================
   Render — Item de reporte
   ============================================================ */
function renderReportItem(m, opts = {}) {
  const li = document.createElement('li');
  li.className = 'report-item';
  li.dataset.prio = m.priority;
  li.dataset.id = m.messageId;

  const kw = KEYWORDS.find(k => k.id === m.messageType);
  const icon = kw?.icon || '📍';
  const label = kw?.label || m.messageType;

  const statusLabel = {
    stored: 'Almacenado', pending: 'Pendiente',
    relayed: 'Retransmitido', confirmed: 'Confirmado', expired: 'Expirado',
  }[m.deliveryStatus] || m.deliveryStatus;

  const metaParts = [
    `${fmtDate(m.createdAt)}`,
    (m.latitude != null && m.longitude != null)
      ? `📍 ${m.latitude.toFixed(4)}, ${m.longitude.toFixed(4)}` : null,
    `saltos ${m.hopCount}/${Messages.MAX_HOPS}`,
  ].filter(Boolean);

  li.innerHTML = `
    <div class="report-head">
      <div class="report-type">
        <span>${icon}</span>
        <span>${esc(label)}</span>
        <span class="badge">${PRIO_LABEL[m.priority]}</span>
        ${m.isDemo ? '<span class="badge badge--demo">DEMO</span>' : ''}
        <span class="badge">${esc(statusLabel)}</span>
      </div>
      ${opts.showDelete ? `<button class="icon-btn" data-act="del" data-id="${esc(m.messageId)}" title="Eliminar">🗑️</button>` : ''}
    </div>
    <div class="report-meta">${esc(metaParts.join(' · '))}</div>
    <div class="report-content">${esc(m.content)}</div>
  `;
  return li;
}

async function renderAllReports() {
  await Messages.markExpired();
  const all = await Store.allMessages();

  const q  = $('#filterText').value.trim().toLowerCase();
  const fp = $('#filterPriority').value;
  const sortBy = $('#sortBy').value;

  let list = all.filter(m => {
    if (fp && m.priority !== fp) return false;
    if (q) {
      const kw = KEYWORDS.find(k => k.id === m.messageType);
      const hay = ((m.content||'') + ' ' + (kw?.label || '') + ' ' + m.messageType).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  list = Priority.sort(list, sortBy);

  const ul = $('#allReports');
  ul.innerHTML = list.length ? '' : '<li class="report-item">Sin resultados.</li>';
  list.forEach(m => ul.appendChild(renderReportItem(m, { showDelete: true })));
}

/* ============================================================
   Mapa
   ============================================================ */
let mapInstance = null, mapMarkers = [];
async function initMap() {
  const el = $('#map'), fallback = $('#mapFallback');
  if (typeof L === 'undefined') {
    el.style.display = 'none';
    fallback.hidden = false;
    renderMapList();
    return;
  }
  el.style.display = '';
  fallback.hidden = true;

  if (!mapInstance) {
    mapInstance = L.map('map').setView([14.6349, -90.5069], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
    }).addTo(mapInstance);
  }
  mapMarkers.forEach(mk => mapInstance.removeLayer(mk));
  mapMarkers = [];

  const all = await Store.allMessages();
  const withGeo = all.filter(m => m.latitude != null && m.longitude != null);

  withGeo.forEach(m => {
    const color = m.priority === 'CRITICO' ? '#ef4444'
      : m.priority === 'ALTO' ? '#f97316' : '#64748b';
    const mk = L.circleMarker([m.latitude, m.longitude], {
      radius: 9, color, fillColor: color, fillOpacity: .85, weight: 2,
    }).addTo(mapInstance);
    const kw = KEYWORDS.find(k => k.id === m.messageType);
    mk.bindPopup(
      `<strong>${kw?.icon || ''} ${esc(kw?.label || m.messageType)}</strong><br>` +
      `${esc(m.content)}<br><small>${fmtDate(m.createdAt)}</small>`
    );
    mapMarkers.push(mk);
  });
  if (withGeo.length) {
    try { mapInstance.fitBounds(L.featureGroup(mapMarkers).getBounds().pad(0.2)); } catch {}
  }
  renderMapList(withGeo);
}

function renderMapList(list) {
  const ul = $('#mapList');
  ul.innerHTML = '';
  if (!list) {
    Store.allMessages().then(all => {
      const withGeo = all.filter(m => m.latitude != null && m.longitude != null);
      renderMapList(withGeo);
    });
    return;
  }
  if (!list.length) {
    ul.innerHTML = '<li class="report-item">Ningún reporte tiene GPS.</li>';
    return;
  }
  list.forEach(m => ul.appendChild(renderReportItem(m)));
}

/* ============================================================
   Demo + Export
   ============================================================ */
async function loadDemo() {
  const samples = ['herido', 'ruta', 'agua', 'atrapado'].map(id => KEYWORDS.find(k => k.id === id));
  for (const k of samples) {
    const m = Messages.make({
      type: k.id, content: k.content, priority: k.prio, isDemo: true,
    });
    await Messages.save(m);
  }
  UI.toast('Datos demo cargados.', 'ok');
  renderSummary(); renderAllReports();
}
async function exportJSON() {
  const messages = await Store.allMessages();
  const payload = {
    exportedAt: new Date().toISOString(),
    originId: getOriginId(),
    messages,
    note: 'Prototipo — datos locales, sin transmisión real.',
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `emergency-${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
  UI.toast('Exportación descargada.', 'ok');
}

/* ============================================================
   Estado de conexión
   ============================================================ */
function updateConnStatus() {
  const s = CommAdapter.status();
  const dot = $('#connDot'), txt = $('#connText');
  if (s.available && s.peers.length) {
    dot.classList.add('dot--on'); txt.textContent = `${s.peers.length} cerca`;
  } else {
    dot.classList.remove('dot--on'); txt.textContent = 'Sin red';
  }
}

/* ============================================================
   Eventos globales
   ============================================================ */
function bindGlobalEvents() {
  $('#dockReport').addEventListener('click', () => switchModule('report'));
  $('#dockMap').addEventListener('click',    () => switchModule('map'));

  $$('.subtab').forEach(t =>
    t.addEventListener('click', () => switchSub(t.dataset.sub))
  );

  document.body.addEventListener('click', async (e) => {
    const act = e.target.closest('[data-act]');
    if (!act) return;
    if (act.dataset.act === 'del') {
      const ok = await UI.confirm('¿Eliminar este reporte?', 'Eliminar');
      if (ok) {
        await Store.deleteMessage(act.dataset.id);
        UI.toast('Reporte eliminado.', 'ok');
        renderSummary(); renderAllReports();
      }
    }
  });

  $('#btnLoadDemo')?.addEventListener('click', loadDemo);
  $('#btnExport')?.addEventListener('click', exportJSON);

  $('#filterText').addEventListener('input', renderAllReports);
  $('#filterPriority').addEventListener('change', renderAllReports);
  $('#sortBy').addEventListener('change', renderAllReports);
}

/* ============================================================
   Arranque
   ============================================================ */
async function boot() {
  renderKeywords();
  bindGlobalEvents();
  updateConnStatus();
  await renderSummary();
  renderAllReports();
  console.info('[Red de Emergencia]', CommAdapter.status());
}
document.addEventListener('DOMContentLoaded', boot);
</script>
